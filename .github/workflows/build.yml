name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/*.apk OrbeOS.apk && ls -lh OrbeOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrbeOS
          path: OrbeOS.apk

      # Stable download link for the TV:
      # https://github.com/<you>/<repo>/releases/latest/download/OrbeOS.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ORBÉ OS build ${{ github.run_number }}
          files: OrbeOS.apk
          make_latest: true
